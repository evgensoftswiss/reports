<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Planner</title>
  <link rel="stylesheet" href="styles.css?v=0.4.7">
  <script src="config.js?v=0.4.7"></script>
  <script src="version.js?v=0.4.7" defer></script>
  <script src="app.js?v=0.4.7" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.initGoogleSignIn?.()"></script>
</head>
<body>
  <main class="shell gateway-shell">
    <section id="authView" class="auth-card">
      <div class="auth-icon">✓</div>
      <div class="eyebrow">PLANNING</div>
      <h1>Weekly Planner</h1>
      <p>Войди через разрешённый Google-аккаунт.</p>
      <div id="googleButton" class="google-button"></div>
      <div id="authMessage" class="message" role="status"></div>
    </section>

    <section id="routeView" class="auth-card hidden">
      <div class="eyebrow">ДОСТУП РАЗРЕШЁН</div>
      <h2 id="welcomeTitle">Добро пожаловать</h2>
      <p id="welcomeEmail"></p>
      <div class="route-actions">
        <a class="route-card" href="planner.html"><strong>Мой план</strong><span>Формирование плана на следующую неделю</span></a>
        <a id="managerRoute" class="route-card hidden" href="manager.html"><strong>Менеджер</strong><span>Планы и распределение задач команды</span></a>
        <a id="workloadRoute" class="route-card hidden" href="workload.html"><strong>Загруженность команды</strong><span>JIRA-отчёт с защищённым серверным кешем</span></a>
      </div>
      <button id="logoutBtn" class="button button-ghost" type="button">Выйти</button>
    </section>
  </main>
  <div class="app-version">Интерфейс v0.4.7. API v…</div>
</body>
</html>
