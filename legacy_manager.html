<title>Weekly Planner Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#27313c;font-family:Arial,sans-serif}.wrap{width:100%;padding:22px}
header{display:flex;align-items:center;gap:16px;margin-bottom:18px}h1{font-size:24px;margin:0;cursor:pointer}.period{font-size:13px;color:#74808c;margin-top:5px}.export-btn{background:#e8eef8;color:#245cae;border:1px solid #bfd0e8;padding:10px 16px}.export-btn:hover{background:#dce8f8}
button{font:inherit;border:0;border-radius:10px;cursor:pointer;font-weight:700}.logout-btn{margin-left:auto;background:#fff;color:#a32929;border:1px solid #efb8b8;padding:10px 16px}.logout-btn:hover{background:#fff1f1}.load-btn{background:#73b56c;color:#fff;padding:12px 30px;font-size:16px}.load-btn:hover{background:#5ea456}.load-btn:disabled{opacity:.6;cursor:default}

.table-wrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{font-size:12px;color:#6b7785;background:#fafbfc}td{font-size:13px}.stream-col{width:160px}.hours-col{width:90px;text-align:center}.hours{text-align:center;background:#f4f5f6;border:1px solid #dfe3e7;border-radius:7px;padding:7px 8px}.stream{display:inline-block;padding:4px 10px 5px;border-radius:999px;background:#eef2f6;white-space:nowrap}.status{display:inline-block;padding:4px 12px 5px;border-radius:999px;background:#eef2f6;color:#56616d;font-size:12px;white-space:nowrap;margin-top:4px}.dist-table{width:100%;table-layout:fixed}.dist-table .task-col{width:30%}.dist-table .stream-col{width:13%}.dist-table .complexity-col{width:9%;text-align:center}.dist-table .days-col{width:48%;padding:0}.empty{padding:20px;color:#7a8693;text-align:center}
.meetings th:nth-child(2),.meetings td:nth-child(2){width:100px;text-align:center}.meetings th:nth-child(3),.meetings td:nth-child(3){width:180px}
.error{display:none;background:#ffe8e8;color:#a32929;border:1px solid #f3baba;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.manager-actions{margin-left:auto;display:flex;align-items:center;gap:16px}.logout-btn{margin-left:0}
.pie-legend{display:flex;flex-direction:column;gap:6px;margin-left:14px;min-width:150px}.pie-legend-item{display:flex;align-items:center;gap:7px;font-size:12px}.pie-legend-swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}.pie-label{display:none}.zero-value{opacity:.25}
.comment-fold{position:relative;width:100%;padding-right:22px;cursor:pointer;line-height:1.4}.comment-fold:focus-visible{outline:2px solid #8fb8e8;outline-offset:2px;border-radius:3px}.comment-fold-text{display:block;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.comment-fold-arrow{position:absolute;right:2px;top:50%;color:#74808c;font-size:14px;line-height:1;transform:translateY(-50%);transition:transform .16s ease}.comment-fold.open .comment-fold-text{overflow:visible;white-space:normal;text-overflow:clip}.comment-fold.open .comment-fold-arrow{transform:translateY(-50%) rotate(180deg)}
.percent-col{width:80px;text-align:center}.dist-table-wrap{overflow-x:hidden}.plan-total-warning{color:#c62828}
/* One text node; expanding changes the table row height, never adds a copy. */
.comment-fold{display:block;min-width:0;min-height:32px;padding:6px 24px 6px 0}
.comment-fold-text{min-width:0;overflow-wrap:anywhere}
.comment-fold.open .comment-fold-text{overflow:hidden;max-height:none;white-space:normal}
.dist-table{width:99%;table-layout:fixed}
.dist-table .task-col{width:30%}
.dist-table .stream-col{width:18%}
.dist-table .complexity-col{width:90px;white-space:nowrap;padding:9px 4px}
.dist-table .days-col{width:auto}
.dist-table td:first-child{overflow-wrap:anywhere}
.dist-table .stream{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.dist-table .status{max-width:100%;white-space:normal}
.dist-table .dist-track{width:calc(100% - 18px);margin:0 9px;overflow:visible}
.dist-table .dist-header{margin:0 9px}
.pie-label{font-size:7px;font-weight:700;fill:#27313c;pointer-events:none}.percent-badge{display:inline-block;min-width:48px;padding:7px 8px;text-align:center;background:#f4f5f6;border:1px solid #dfe3e7;border-radius:7px}.stream-plan-table th:nth-child(1),.stream-plan-table td:nth-child(1){width:25%}.stream-plan-table th:nth-child(2),.stream-plan-table td:nth-child(2){width:16%}.stream-plan-table th:nth-child(3),.stream-plan-table td:nth-child(3){width:12%}.stream-plan-table th:nth-child(4),.stream-plan-table td:nth-child(4){width:47%;overflow-wrap:anywhere}
.pie-chart-wrap{display:flex;justify-content:center;align-items:center;min-height:260px;position:relative}.stream-pie{width:min(100%,280px);height:auto;overflow:visible}.stream-pie path,.stream-pie circle{stroke:#fff;stroke-width:2;cursor:pointer;transition:transform .18s ease,filter .18s ease}.stream-pie path:hover,.stream-pie circle:hover{filter:brightness(1.08);transform:translate(var(--explode-x),var(--explode-y))}.pie-tooltip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:7px 10px;border-radius:8px;background:#27313c;color:#fff;font-size:12px;line-height:1.35;text-align:center;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease}.pie-tooltip.visible{opacity:1}.pie-empty{color:#7a8693;text-align:center;padding:20px;font-size:13px}
.period-select{margin-top:7px;min-width:240px;padding:7px 30px 7px 10px;border:1px solid #cbd3dc;border-radius:8px;background:#fff;color:#27313c}.user-row{padding:10px 12px;border-radius:8px}.user-name-input{width:100%;padding:5px 7px;margin-bottom:4px;border:1px solid #d7dde5;border-radius:6px;background:#fff}.user-name-input:focus{outline:2px solid #9ec1ee;border-color:#75a4dd}.user-details{display:flex;align-items:baseline;gap:5px;min-width:0}.user-email-label{font-size:14px;color:#526170;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-time{font-size:14px;font-weight:500}
.generate-btn{background:#6a8ed7;color:#fff;padding:10px 14px}.generate-btn:hover{background:#587bc2}.generate-btn:disabled{opacity:.6;cursor:default}.manager-edit{width:100%;padding:7px;border:1px solid #d7dde5;border-radius:6px;font:inherit}.manager-edit.hours-edit{text-align:center}.manager-edit.comment-edit{min-height:34px;resize:vertical}.meeting-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 0}.small-btn{padding:7px 10px;background:#e8eef8;color:#245cae;border:1px solid #bfd0e8}.remove-btn{padding:5px 8px;background:#fff;color:#a32929;border:1px solid #efb8b8}.save-note{font-size:12px;color:#74808c;margin-top:8px}
.user-row{display:flex;align-items:center;gap:4px}.user-row .user{min-width:0}.user-edit-btn{flex:0 0 auto;width:31px;height:31px;padding:0;border:1px solid #cbd7e7;border-radius:8px;background:#fff;color:#3566a9;font-size:18px;line-height:1}.user-edit-btn:hover{background:#e8f0fb}.profile-modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(25,37,51,.4)}.profile-modal{width:min(100%,540px);background:#fff;border-radius:14px;box-shadow:0 18px 48px rgba(25,37,51,.28);overflow:hidden}.profile-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #edf0f4}.profile-modal-head h2{margin:0;font-size:18px}.profile-modal-close{width:30px;height:30px;padding:0;background:transparent;color:#586775;font-size:24px}.profile-modal-body{padding:18px}.profile-modal-body label{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:#526170}.profile-modal-body input{width:100%;margin:0 0 15px;padding:9px 10px;border:1px solid #cbd3dc;border-radius:8px;font:inherit}.profile-modal-email{font-size:13px;color:#6f7b87;margin:-4px 0 16px}.profile-modal-actions{display:flex;justify-content:flex-end;padding:14px 18px;border-top:1px solid #edf0f4}.profile-modal-save{background:#73b56c;color:#fff;padding:10px 16px}.profile-modal-save:disabled{opacity:.6;cursor:default}
@media(max-width:900px){.grid{grid-template-columns:1fr}.right-stack{min-width:0}.users{grid-row:auto}.wrap{padding:12px}}
.dist-header{height:34px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.dist-header span{height:34px;display:flex;align-items:center;justify-content:center;border-left:1px solid #edf0f4}.dist-header span:nth-child(even){background:#fafbfc}.dist-track{height:42px;position:relative;width:100%;overflow:hidden}.dist-day{position:absolute;top:0;bottom:0;width:20%;border-left:1px solid #edf0f4;background:#fff}.dist-day:nth-child(even){background:#fafbfc}.dist-day:nth-child(1){left:0}.dist-day:nth-child(2){left:20%}.dist-day:nth-child(3){left:40%}.dist-day:nth-child(4){left:60%}.dist-day:nth-child(5){left:80%}.dist-line{position:absolute;top:50%;height:13px;z-index:2;transform:translateY(-50%)}.dist-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;z-index:3;transform:translate(-50%,-50%)}.dist-line.green,.dist-dot.green{background:#58bf68}.dist-line.yellow,.dist-dot.yellow{background:#f0c700}.dist-line.red,.dist-dot.red{background:#ef5350}.dist-task-status{margin-top:5px}</style></head><body><div class="wrap">
<header><div><h1 id="managerHome">Weekly Planner Manager</h1><select id="managerPeriodSelect" class="period-select" aria-label="Период"></select><div id="period" class="period"></div></div><div class="manager-actions"><button id="generateReports" class="generate-btn" type="button">Создать отчёты для всех</button><button id="load" class="load-btn">Обновить</button><button id="export" class="export-btn" type="button">Экспорт</button><button id="logout" class="logout-btn" type="button">Выйти</button></div></header>
<div id="error" class="error"></div>
<div class="grid">
<div class="left-stack">
<section class="section users"><div class="section-head"><h2>Пользователи</h2></div><div id="users" class="pad"></div></section>
<section class="section"><div class="section-head"><h2>Общий план на следующую неделю</h2></div><div id="aggregate" class="pad"></div></section>
<section class="section"><div class="section-head"><h2>Распределение по стримам</h2></div><div id="streamPie" class="pad"></div></section>
</div>
<section class="section selected-user-panel">
  <div class="selected-user-head"><h2>Выбранный пользователь</h2><div id="selectedUserLabel" class="selected-user-label">Пользователь не выбран</div></div>
  <div class="selected-user-content">
    <section class="inner-section"><div class="section-head"><h2>План на следующую неделю <span id="selectedPlanTotal">(0h)</span></h2></div><div id="plan" class="pad"></div><div id="planSaveNote" class="pad save-note"></div></section>
    <section class="inner-section"><div class="section-head"><h2>Распределение задач на следующую неделю</h2><div id="distributionPeriod" class="subnote"></div></div><div id="distribution" class="pad"></div></section>
    <section class="inner-section"><div class="section-head"><h2>Миты на следующую неделю</h2></div><div id="meetings" class="pad"></div></section>
  </div>
</section>
</div></div>
<div id="profileModal" class="profile-modal-backdrop" hidden>
  <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
    <div class="profile-modal-head"><h2 id="profileModalTitle">Профиль пользователя</h2><button id="profileModalClose" class="profile-modal-close" type="button" aria-label="Закрыть">×</button></div>
    <div class="profile-modal-body"><div id="profileModalEmail" class="profile-modal-email"></div><label for="profileName">Имя</label><input id="profileName" maxlength="80" autocomplete="off"><label for="profileCalendar">Ссылка на календарь</label><input id="profileCalendar" type="url" inputmode="url" placeholder="https://calendar.google.com/calendar/ical/…"></div>
    <div class="profile-modal-actions"><button id="profileModalSave" class="profile-modal-save" type="button">Сохранить и закрыть</button></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);let state={users:[],selected:null,selectedPlan:null,streamColors:{},aggregatePlan:[],userTotals:{},period:'',periods:[]};let planSaveTimer=0;
function logout(){sessionStorage.removeItem('weeklyPlanner.accessToken');sessionStorage.removeItem('weeklyPlanner.user');window.location.replace(new URL('index.html',window.location.href))}
$('logout').addEventListener('click',logout);
$('managerHome').addEventListener('click',()=>{window.location.href='https://evgensoftswiss.github.io/reports/'});
function formatPercent(value){return `${Number(value||0).toFixed(1)}%`}
function exportPlan(){const rows=state.aggregatePlan||[];const text=['Stream\tHours\tPercent\tComment',...rows.map(r=>{const total=rows.reduce((s,x)=>s+parseHours(x.hours),0);const pct=total?parseHours(r.hours)/total*100:0;return `${r.stream||''}\t${r.hours||''}\t${formatPercent(pct)}\t${String(r.comment||'').replace(/\s+/g,' ').trim()}`})].join('\n');navigator.clipboard?.writeText(text).then(()=>window.open('https://sheets.new','_blank')).catch(()=>alert('Не удалось скопировать данные'))}
$('export').addEventListener('click',exportPlan);
function toggleCommentFold(fold){
  const isOpen=fold.classList.toggle('open');
  fold.setAttribute('aria-expanded',String(isOpen));
}
document.addEventListener('click',event=>{
  const fold=event.target.closest('.comment-fold');
  if(fold)toggleCommentFold(fold);
});
document.addEventListener('keydown',event=>{
  if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('comment-fold')){
    event.preventDefault();
    toggleCommentFold(event.target);
  }
});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function error(msg=''){const e=$('error');e.textContent=msg;e.style.display=msg?'block':'none'}
async function json(r){const t=await r.text();let p;try{p=JSON.parse(t)}catch{throw new Error(t||`HTTP ${r.status}`)}if(!r.ok)throw new Error(p.error||`HTTP ${r.status}`);return p}
function periodLabel(period){
  const [from,to]=String(period||'').split('_');
  return from&&to?`${from} — ${to}`:String(period||'');
}
function renderPeriodSelector(){
  const select=$('managerPeriodSelect'); if(!select)return;
  const values=Array.from(new Set([state.period,...(state.periods||[])]).values()).filter(Boolean);
  select.innerHTML=values.map(period=>`<option value="${esc(period)}"${period===state.period?' selected':''}>${esc(periodLabel(period))}</option>`).join('');
}
async function loadPeriods(){
  const payload=await json(await fetch('/api/manager/periods'));
  state.periods=payload.periods||[];
  renderPeriodSelector();
}
function renderUsers(){const b=$('users');if(!state.users.length){b.innerHTML='<div class="empty">Нет загруженных отчетов</div>';return}b.innerHTML=state.users.map((u,i)=>{const minutes=state.userTotals[u.filename]??state.userTotals[u.email]??null;const label=minutes===null?'…':formatPlanTime(minutes);const warning=minutes!==null&&minutes!==2400?' warning':'';const name=String(u.display_name||'').trim();return `<div class="user-row ${state.selected===i?'active':''}"><button class="user-edit-btn" type="button" data-profile-i="${i}" title="Редактировать пользователя" aria-label="Редактировать пользователя">✎</button><button class="user" data-i="${i}"><span class="user-details"><span>${esc(name||'Без имени')}</span><span class="user-email-label">(${esc(u.email)})</span></span><span class="user-time${warning}">${label}</span></button></div>`}).join('');b.querySelectorAll('.user').forEach(x=>x.onclick=()=>selectUser(Number(x.dataset.i)));b.querySelectorAll('[data-profile-i]').forEach(button=>button.onclick=event=>{event.stopPropagation();openProfileModal(Number(button.dataset.profileI));})}
function cacheUserTotal(user,plan){const minutes=(plan?.stream_plan||[]).reduce((sum,row)=>sum+parseHours(row.hours),0);state.userTotals[user.filename]=minutes;state.userTotals[user.email]=minutes;}
async function loadUserTotals(){await Promise.all(state.users.map(async user=>{try{const payload=await json(await fetch('/api/user?filename='+encodeURIComponent(user.filename)+'&period='+encodeURIComponent(state.period)));cacheUserTotal(user,payload.plan); }catch(_){}}));renderUsers();}

let profileModalUser=null;
async function openProfileModal(index){const user=state.users[index];if(!user)return;error('');try{const payload=await json(await fetch('/api/manager/users/profile?email='+encodeURIComponent(user.email)));const profile=payload.profile||{};profileModalUser=user;$('profileModalEmail').textContent=profile.email||user.email;$('profileName').value=profile.display_name||'';$('profileCalendar').value=profile.calendar_url||'';$('profileModal').hidden=false;$('profileName').focus();}catch(e){error(`Не удалось открыть профиль: ${e.message}`);}}
async function closeProfileModal(save=true){if(!$('profileModal').hidden&&save&&profileModalUser){const button=$('profileModalSave');button.disabled=true;try{const result=await json(await fetch('/api/manager/users/profile',{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:profileModalUser.email,display_name:$('profileName').value.trim(),calendar_url:$('profileCalendar').value.trim()})}));profileModalUser.display_name=result.profile?.display_name||'';$('profileModal').hidden=true;profileModalUser=null;renderUsers();if(state.selected!==null){const selected=state.users[state.selected];const name=String(selected?.display_name||'').trim();$('selectedUserLabel').textContent=name?`${name} (${selected.email})`:selected?.email||'';}await refreshAggregate();}catch(e){error(`Не удалось сохранить профиль: ${e.message}`);}finally{button.disabled=false;}}else{$('profileModal').hidden=true;profileModalUser=null;}}
$('profileModalSave').addEventListener('click',()=>closeProfileModal(true));
$('profileModalClose').addEventListener('click',()=>closeProfileModal(true));
$('profileModal').addEventListener('click',event=>{if(event.target===$('profileModal'))closeProfileModal(true);});
function streamStyle(name){const c=state.streamColors?.[name];return c?`style="background:${esc(c.background)};color:${esc(c.color)}"`:''}
function consolidateCommunicationComment(comment){
  const totals=new Map();
  String(comment||'').split(/\s*,\s*/).map(item=>item.trim()).filter(Boolean).forEach(item=>{
    const match=item.match(/^(.*?)\s*\(([0-9]+(?:[.,][0-9]+)?)\)\s*$/);
    const name=(match?match[1]:item).trim();
    if(!name)return;
    const hours=match?Number(match[2].replace(',','.')):0;
    totals.set(name,(totals.get(name)||0)+(Number.isFinite(hours)?hours:0));
  });
  return [...totals.entries()].map(([name,hours])=>`${name} (${Number(hours.toFixed(2))})`).join(', ');
}
function commentCell(row){
  let comment=String(row.comment||'');
  if(String(row.stream||'').trim().toLocaleLowerCase()==='communication') comment=consolidateCommunicationComment(comment);
  if(!comment)return '';
  if(String(row.stream||'').trim().toLocaleLowerCase()!=='communication' || comment.length<40) return esc(comment);
  return `<div class="comment-fold" role="button" tabindex="0" aria-expanded="false"><div class="comment-fold-text">${esc(comment)}</div><span class="comment-fold-arrow" aria-hidden="true">⌄</span></div>`;
}
function formatPlanTime(minutes){const n=Math.max(0,Math.round(Number(minutes)||0)),h=Math.floor(n/60),m=n%60;return m?`${h}h ${m}m`:`${h}h`}
function planHtml(rows){
  const total=(rows||[]).reduce((sum,r)=>sum+parseHours(r.hours),0);
  const title=$('selectedPlanTotal');if(title){title.textContent=`(${formatPlanTime(total)})`;title.classList.toggle('plan-total-warning',total!==2400);}
  if(!rows?.length)return '<div class="empty">Нет данных</div>';
  return `<div class="table-wrap"><table><thead><tr><th class="stream-col">Stream</th><th class="hours-col">Hours</th><th class="percent-col">%</th><th>Comment</th></tr></thead><tbody>${rows.map(r=>{const mins=parseHours(r.hours),pct=total?mins/total*100:0;return `<tr><td><span class="stream" ${streamStyle(r.stream)}>${esc(r.stream)}</span></td><td><div class="hours ${mins===0?'zero-value':''}">${esc(r.hours)}</div></td><td class="percent-col"><span class="percent-badge ${mins===0?'zero-value':''}">${formatPercent(pct)}</span></td><td>${commentCell(r)}</td></tr>`}).join('')}</tbody></table></div>`;
}
function editablePlanHtml(rows){
  const total=(rows||[]).reduce((sum,row)=>sum+parseHours(row.hours),0);
  const title=$('selectedPlanTotal');if(title){title.textContent=`(${formatPlanTime(total)})`;title.classList.toggle('plan-total-warning',total!==2400);}
  if(!rows?.length)return '<div class="empty">Нет данных</div>';
  return `<div class="table-wrap"><table><thead><tr><th class="stream-col">Stream</th><th class="hours-col">Hours</th><th class="percent-col">%</th><th>Comment</th></tr></thead><tbody>${rows.map((row,index)=>{const minutes=parseHours(row.hours),percent=total?minutes/total*100:0;return `<tr><td><span class="stream" ${streamStyle(row.stream)}>${esc(row.stream)}</span></td><td><input class="manager-edit hours-edit ${minutes===0?'zero-value':''}" data-plan-hours="${index}" value="${esc(row.hours)}"></td><td class="percent-col"><span class="percent-badge ${minutes===0?'zero-value':''}" data-plan-percent="${index}">${formatPercent(percent)}</span></td><td><textarea class="manager-edit comment-edit" data-plan-comment="${index}">${esc(row.comment)}</textarea></td></tr>`;}).join('')}</tbody></table></div>`;
}
function editableMeetingsHtml(meetings){
  const groups=[['calendar','Из календаря'],['manual','Добавлено вручную']];
  return groups.map(([group,label])=>{const rows=Array.isArray(meetings?.[group])?meetings[group]:[];return `<div><div class="subnote">${label}</div>${rows.length?`<div class="table-wrap"><table class="meetings"><thead><tr><th>Мит</th><th>Длит.</th><th>Когда</th><th></th></tr></thead><tbody>${rows.map((item,index)=>`<tr><td><input class="manager-edit" data-meeting-field="summary" data-meeting-group="${group}" data-meeting-index="${index}" value="${esc(item.summary)}"></td><td><input class="manager-edit hours-edit" data-meeting-field="minutes" data-meeting-group="${group}" data-meeting-index="${index}" value="${esc(item.minutes)}"></td><td><input class="manager-edit" data-meeting-field="when" data-meeting-group="${group}" data-meeting-index="${index}" value="${esc(item.when)}"></td><td><button class="remove-btn" type="button" data-remove-meeting="${group}:${index}">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="subnote">Нет записей</div>'}</div>`}).join('')+`<div class="meeting-actions"><button class="small-btn" id="addManagerMeeting" type="button">+ Добавить мит</button></div>`;
}
function bindManagerEditors(){
  document.querySelectorAll('[data-plan-hours]').forEach(input=>input.addEventListener('input',event=>{const index=Number(event.target.dataset.planHours);state.selectedPlan.stream_plan[index].hours=event.target.value;refreshManagerPlanPercents();queueManagerSave();}));
  document.querySelectorAll('[data-plan-comment]').forEach(input=>input.addEventListener('input',event=>{state.selectedPlan.stream_plan[Number(event.target.dataset.planComment)].comment=event.target.value;queueManagerSave();}));
  document.querySelectorAll('[data-meeting-field]').forEach(input=>input.addEventListener('input',event=>{const target=event.target,group=target.dataset.meetingGroup,index=Number(target.dataset.meetingIndex),field=target.dataset.meetingField;let value=target.value;if(field==='minutes')value=Math.max(0,Number(value)||0);state.selectedPlan.meetings[group][index][field]=value;queueManagerSave();}));
  document.querySelectorAll('[data-remove-meeting]').forEach(button=>button.addEventListener('click',()=>{const [group,index]=button.dataset.removeMeeting.split(':');state.selectedPlan.meetings[group].splice(Number(index),1);renderSelectedPlan();queueManagerSave();}));
  $('addManagerMeeting')?.addEventListener('click',()=>{state.selectedPlan.meetings.manual.push({summary:'',minutes:0,when:''});renderSelectedPlan();queueManagerSave();});
}
function refreshManagerPlanPercents(){
  const rows=state.selectedPlan?.stream_plan||[];const total=rows.reduce((sum,row)=>sum+parseHours(row.hours),0);
  const title=$('selectedPlanTotal');if(title){title.textContent=`(${formatPlanTime(total)})`;title.classList.toggle('plan-total-warning',total!==2400);}
  document.querySelectorAll('[data-plan-percent]').forEach(node=>{const index=Number(node.dataset.planPercent),minutes=parseHours(rows[index]?.hours);node.textContent=formatPercent(total?minutes/total*100:0);node.classList.toggle('zero-value',minutes===0);});
  document.querySelectorAll('[data-plan-hours]').forEach(node=>node.classList.toggle('zero-value',parseHours(node.value)===0));
}
function renderSelectedPlan(){
  const plan=state.selectedPlan||{stream_plan:[],meetings:{calendar:[],manual:[]}};
  if(!plan.meetings)plan.meetings={calendar:[],manual:[]};if(!Array.isArray(plan.meetings.calendar))plan.meetings.calendar=[];if(!Array.isArray(plan.meetings.manual))plan.meetings.manual=[];
  $('plan').innerHTML=editablePlanHtml(plan.stream_plan||[]);$('meetings').innerHTML=editableMeetingsHtml(plan.meetings);bindManagerEditors();
}
function queueManagerSave(){
  clearTimeout(planSaveTimer);$('planSaveNote').textContent='Сохранение…';planSaveTimer=setTimeout(saveSelectedPlan,700);
}
async function saveSelectedPlan(){
  const user=state.users[state.selected];if(!user||!state.selectedPlan)return;
  try{const result=await json(await fetch(`/api/manager/planning/${encodeURIComponent(state.period)}/${encodeURIComponent(user.email)}`,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({data:state.selectedPlan})}));state.selectedPlan=result.plan;cacheUserTotal(user,result.plan);$('planSaveNote').textContent='Сохранено';renderUsers();await refreshAggregate();}catch(e){$('planSaveNote').textContent=`Ошибка сохранения: ${e.message}`;error(`Не удалось сохранить план: ${e.message}`);}
}
async function refreshAggregate(){
  try{const payload=await json(await fetch('/api/bootstrap?period='+encodeURIComponent(state.period)));state.aggregatePlan=payload.aggregate_plan||[];state.streamColors=payload.stream_colors||state.streamColors;renderAggregate();}catch(e){error(e.message);}
}
function parseHours(value){
  const text=String(value??'').trim().toLowerCase().replace(',','.');
  if(!text)return 0;
  const hm=text.match(/^(\d+(?:\.\d+)?)\s*h(?:\s*(\d+)\s*m)?$/);
  if(hm)return Number(hm[1])*60+Number(hm[2]||0);
  const mm=text.match(/^(\d+(?:\.\d+)?)\s*m$/);
  if(mm)return Number(mm[1]);
  const numeric=Number(text); return Number.isFinite(numeric)?numeric*60:0;
}
function renderStreamPie(){
  const box=$('streamPie'); if(!box)return;
  const rows=(state.aggregatePlan||[]).map(r=>({name:String(r.stream||'Без названия'),hours:String(r.hours||'0h'),minutes:parseHours(r.hours)})).filter(r=>r.minutes>0);
  if(!rows.length){box.innerHTML='<div class="pie-empty">Нет запланированных часов</div>';return;}
  const total=rows.reduce((sum,r)=>sum+r.minutes,0), cx=120, cy=120, radius=88;
  const colors=['#4d82d8','#53ad78','#e0a33a','#c96c91','#7f70c9','#3cabb3','#dd765b','#76904b','#a26cba','#5b879f','#d18b52','#6d7884'];
  const point=(angle,r)=>[cx+Math.cos(angle)*r,cy+Math.sin(angle)*r];
  let angle=-Math.PI/2;
  const slices=rows.map((row,i)=>{
    const end=angle+(row.minutes/total)*Math.PI*2, p1=point(angle,radius), p2=point(end,radius);
    const large=end-angle>Math.PI?1:0;
    const path=`M ${cx} ${cy} L ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} A ${radius} ${radius} 0 ${large} 1 ${p2[0].toFixed(2)} ${p2[1].toFixed(2)} Z`;
    const mid=(angle+end)/2, explodeX=(Math.cos(mid)*8).toFixed(2), explodeY=(Math.sin(mid)*8).toFixed(2);
    angle=end;
    const pct=row.minutes/total*100, labelPoint=point(mid,58);
    return `<path d="${path}" fill="${colors[i%colors.length]}" style="--explode-x:${explodeX}px;--explode-y:${explodeY}px" data-name="${esc(row.name)}" data-hours="${(row.minutes/60).toFixed(2)}" data-percent="${pct}"><title>${esc(row.name)} — ${pct}% — ${esc(row.hours)}</title></path>`;
  }).join('');
  const legend=rows.map((row,i)=>`<div class="pie-legend-item"><span class="pie-legend-swatch" style="background:${colors[i%colors.length]}"></span><span>${esc(row.name)} — ${formatPercent(row.minutes/total*100)}</span></div>`).join('');
  box.innerHTML=`<div class="pie-chart-wrap"><svg class="stream-pie" viewBox="0 0 240 240" role="img" aria-label="Распределение часов по стримам"><circle cx="120" cy="120" r="38" fill="#fff" stroke="#fff" stroke-width="2"></circle>${slices}<circle cx="120" cy="120" r="38" fill="#fff" stroke="#fff" stroke-width="2"></circle></svg><div class="pie-legend">${legend}</div><div class="pie-tooltip" id="pieTooltip"></div></div>`;
  const tooltip=$('pieTooltip');
  box.querySelectorAll('.stream-pie path').forEach(slice=>{
    const show=()=>{tooltip.textContent=`${slice.dataset.name}: ${formatPercent(Number(slice.dataset.percent))} · ${slice.dataset.hours} ч`;tooltip.classList.add('visible');};
    slice.addEventListener('mouseenter',show); slice.addEventListener('focus',show);
    slice.addEventListener('mouseleave',()=>tooltip.classList.remove('visible')); slice.addEventListener('blur',()=>tooltip.classList.remove('visible'));
  });
}
function renderAggregate(){ $('aggregate').innerHTML=planHtml(state.aggregatePlan); renderStreamPie(); }
function meetingRows(items){return (items||[]).map(m=>`<tr><td>${esc(m.summary)}</td><td>${esc(m.minutes?((m.minutes%60?Math.floor(m.minutes/60)+'h '+m.minutes%60+'m':m.minutes/60+'h')):'0h')}</td><td>${esc(m.when)}</td></tr>`).join('')}
function meetingsHtml(m){const all=[...(m?.calendar||[]),...(m?.manual||[])];if(!all.length)return '<div class="empty">Нет данных</div>';return `<div class="table-wrap"><table class="meetings"><thead><tr><th>Мит</th><th>Длит.</th><th>Когда</th></tr></thead><tbody>${meetingRows(all)}</tbody></table></div>`}

function statusStyle(name){
  const palette={
    'Done':['#dff4c7','#315d13'],'In Progress':['#d9efff','#155b8a'],
    'Customer Design Review':['#fff0b8','#725600'],'Blocked':['#ffd6d6','#9f1d1d'],
    'Submitted':['#fff0b8','#725600'],'To Do':['#eef2f6','#56616d'],
    'Verification':['#f6d0a8','#8a4d00'],'Waiting for customer':['#f6d0a8','#8a4d00']
  };
  const c=palette[name]; return c?`style="background:${c[0]};color:${c[1]}"`:'';
}
function distributionDayIndex(value,weekStart){
  if(!value||value==='0'||!weekStart)return null;
  const start=Date.parse(`${weekStart}T00:00:00Z`),date=Date.parse(`${value}T00:00:00Z`);
  if(Number.isNaN(start)||Number.isNaN(date))return null;
  const diff=Math.round((date-start)/86400000);
  if(diff<0)return -1;
  if(diff>4)return 5;
  return diff;
}
function addDaysIso(value,days){
  const date=new Date(`${value}T00:00:00Z`);
  date.setUTCDate(date.getUTCDate()+days);
  return date.toISOString().slice(0,10);
}
function businessDaysRemainingFrom(startDate,endDate){
  if(!startDate||!endDate||startDate==='0'||endDate==='0')return 0;
  const start=new Date(`${startDate}T00:00:00Z`),end=new Date(`${endDate}T00:00:00Z`);
  if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime())||end<=start)return 0;
  let count=0,cursor=new Date(start);cursor.setUTCDate(cursor.getUTCDate()+1);
  while(cursor<=end){const day=cursor.getUTCDay();if(day!==0&&day!==6)count++;cursor.setUTCDate(cursor.getUTCDate()+1)}
  return count;
}
function distributionColor(dayDate,endDate){
  if(!endDate||endDate==='0')return 'green';
  const days=businessDaysRemainingFrom(dayDate,endDate);
  return days<=1?'red':days<=3?'yellow':'green';
}
function distributionPointPercent(index){
  if(index===null||index===-1)return 0;
  if(index>=5)return 100;
  return index*20+10;
}
function distributionHtml(rows,weekStart){
  if(!rows?.length)return '<div class="empty">Нет подходящих задач</div>';
  const days=['Пн','Вт','Ср','Чт','Пт'];
  const dates=days.map((_,index)=>addDaysIso(weekStart,index));
  return `<div class="table-wrap dist-table-wrap"><table class="dist-table"><thead><tr><th class="task-col">Задача</th><th class="stream-col">Stream</th><th class="complexity-col">Complexity</th><th class="days-col"><div class="dist-header">${days.map(x=>`<span>${x}</span>`).join('')}</div></th></tr></thead><tbody>${rows.map(r=>{
    const startValue=String(r.target_start||'0'),endValue=String(r.target_end||'0');
    const startIndex=distributionDayIndex(startValue,weekStart),endIndex=distributionDayIndex(endValue,weekStart);
    const lineStart=startValue==='0'||startIndex===null||startIndex===-1?0:distributionPointPercent(startIndex);
    const lineEnd=endValue==='0'||endIndex===null?0:distributionPointPercent(endIndex);
    const segments=[];
    if(endValue!=='0'&&lineEnd>=lineStart){
      for(let i=0;i<5;i++){
        const segmentStart=Math.max(lineStart,i*20),segmentEnd=Math.min(lineEnd,(i+1)*20);
        if(segmentEnd>segmentStart)segments.push(`<span class="dist-line ${distributionColor(dates[i],endValue)}" style="left:${segmentStart}%;width:${segmentEnd-segmentStart}%"></span>`);
      }
    }
    const startPercent=startValue==='0'||startIndex===null||startIndex===-1?0:distributionPointPercent(startIndex);
    const endPercent=endValue==='0'||endIndex===null?0:distributionPointPercent(endIndex);
    const startColor=distributionColor(startValue!=='0'?startValue:weekStart,endValue);
    const endColor=distributionColor(endValue!=='0'?endValue:weekStart,endValue);
    const status=r.status?`<div class="dist-task-status"><span class="status" ${statusStyle(r.status)}>${esc(r.status)}</span></div>`:'';
    return `<tr><td><div><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(r.key)}</b></a>${r.summary?' — '+esc(r.summary):''}</div>${status}</td><td><span class="stream" ${streamStyle(r.stream)}>${esc(r.stream)}</span></td><td class="complexity-col">${esc(r.complexity)}</td><td class="days-col"><div class="dist-track">${days.map(()=>'<span class="dist-day"></span>').join('')}${segments.join('')}<span class="dist-dot ${startColor}" style="left:${startPercent}%"></span><span class="dist-dot ${endColor}" style="left:${endPercent}%"></span></div></td></tr>`}).join('')}</tbody></table></div>`;
}
async function loadDistribution(email){
  try{
    const p=await json(await fetch('/api/distribution?email='+encodeURIComponent(email)+'&period='+encodeURIComponent(state.period)));
    $('distributionPeriod').textContent=`${p.period.from} — ${p.period.to}`;
    $('distribution').innerHTML=(p.warning?`<div class="subnote">${esc(p.warning)}</div>`:'')+distributionHtml(p.tasks,p.period.from);
  }catch(e){$('distribution').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function selectUser(i){state.selected=i;renderUsers();const u=state.users[i];const name=String(u.display_name||'').trim();$('selectedUserLabel').textContent=name?`${name} (${u.email})`:u.email;try{const p=await json(await fetch('/api/user?filename='+encodeURIComponent(u.filename)+'&period='+encodeURIComponent(state.period)));state.selectedPlan=JSON.parse(JSON.stringify(p.plan||{}));cacheUserTotal(u,state.selectedPlan);renderUsers();renderSelectedPlan();loadDistribution(u.email)}catch(e){error(e.message)}}
async function bootstrap(){try{const previousEmail=state.users[state.selected]?.email||'';const query=state.period?`?period=${encodeURIComponent(state.period)}`:'';const p=await json(await fetch('/api/bootstrap'+query));state.period=p.period?.folder||state.period;$('period').textContent=p.period.label;state.users=p.users||[];state.streamColors=p.stream_colors||{};state.aggregatePlan=p.aggregate_plan||[];renderAggregate();renderUsers();await loadUserTotals();if(state.users.length){const index=Math.max(0,state.users.findIndex(user=>user.email===previousEmail));selectUser(index)}else{state.selected=null;state.selectedPlan=null;$('selectedUserLabel').textContent='';$('plan').innerHTML='<div class="empty">Нет данных</div>';$('meetings').innerHTML='';$('distribution').innerHTML='';$('planSaveNote').textContent='';}}catch(e){error(e.message)}}
$('load').onclick=async()=>{const b=$('load');b.disabled=true;b.textContent='Обновление…';error('');try{const p=await json(await fetch('/api/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({period:state.period})}));state.period=p.period?.folder||state.period;state.users=p.users||[];state.streamColors=p.stream_colors||state.streamColors;state.aggregatePlan=p.aggregate_plan||[];renderAggregate();state.selected=null;renderUsers();await loadUserTotals();if(state.users.length)await selectUser(0)}catch(e){error(e.message)}finally{b.disabled=false;b.textContent='Обновить'}};
$('managerPeriodSelect').addEventListener('change',async event=>{state.period=event.target.value;state.selected=null;error('');await bootstrap();renderPeriodSelector();});
$('generateReports').addEventListener('click',async()=>{const button=$('generateReports');button.disabled=true;error('');try{const result=await json(await fetch('/api/manager/reports/generate',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({})}));const failed=(result.failed||[]).map(item=>`${item.email}: ${item.error}`).join('; ');alert(`Создано: ${(result.created||[]).length}. Уже существовало: ${(result.skipped||[]).length}.${failed?` Ошибки: ${failed}`:''}`);await loadPeriods();state.period=result.period;await bootstrap();renderPeriodSelector();}catch(e){error(`Не удалось создать отчёты: ${e.message}`);}finally{button.disabled=false;}});
(async()=>{try{await loadPeriods();if(state.periods.length)state.period=state.periods[0];await bootstrap();renderPeriodSelector();}catch(e){error(e.message)}})();
</script></body></html>
