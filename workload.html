<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JIRA Workload Report</title>
  <link rel="stylesheet" href="styles.css?v=0.4.6">
  <script src="config.js?v=0.4.6"></script>
  <script src="version.js?v=0.4.6" defer></script>
  <script src="auth-bridge.js?v=0.4.6"></script>
  <script src="workload.js?v=0.4.6" defer></script>
</head>
<body>
  <main class="workload-shell">
    <header class="workload-topbar">
      <div>
        <div class="eyebrow">PLANNING</div>
        <h1><a class="workload-title-link" href="https://evgensoftswiss.github.io/reports">Отчёт по загруженности</a></h1>
      </div>
      <a class="button button-ghost" href="index.html">На главную</a>
    </header>

    <section class="workload-controls">
      <div class="workload-form-row">
        <div class="workload-fields">
          <label>Дата начала<input id="dateFrom" type="date"></label>
          <label>Дата окончания<input id="dateTo" type="date"></label>
        </div>
        <div class="workload-actions">
          <button type="button" class="button report-button" data-mode="cache">Сформировать отчёт</button>
          <button type="button" class="button report-button today" data-mode="today">Сформировать с обновлением за сегодня</button>
          <button type="button" class="button report-button force" data-mode="force">Сформировать с полным обновлением (--force)</button>
        </div>
      </div>
      <div class="job-status" aria-live="polite">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="statusText" class="message">Готово к формированию</div>
      </div>
    </section>

    <section id="reportPanel" class="report-panel hidden">
      <div id="reportMount" aria-label="Отчёт по загруженности"></div>
    </section>
  </main>
  <div class="app-version">Интерфейс v0.4.6. API v…</div>
</body>
</html>
